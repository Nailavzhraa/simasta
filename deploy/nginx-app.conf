daemon off;
worker_processes 1;
pid /var/www/simasta.bpskotabatu.com/storage/run/nginx.pid;
error_log /var/www/simasta.bpskotabatu.com/storage/logs/nginx-error.log warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/www/simasta.bpskotabatu.com/storage/logs/nginx-access.log;
    client_body_temp_path /var/www/simasta.bpskotabatu.com/storage/run/client;
    proxy_temp_path /var/www/simasta.bpskotabatu.com/storage/run/proxy;
    fastcgi_temp_path /var/www/simasta.bpskotabatu.com/storage/run/fastcgi;
    server {
        listen 127.0.0.1:5013;
        server_name simasta.bpskotabatu.com;
        add_header X-Simasta-App simasta-5013 always;
        root /var/www/simasta.bpskotabatu.com/public;
        index index.php;
        client_max_body_size 22m;
        location / { try_files $uri $uri/ /index.php?$query_string; }
        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param HTTPS on;
            fastcgi_param SERVER_PORT 443;
            fastcgi_pass unix:/var/www/simasta.bpskotabatu.com/storage/run/php.sock;
        }
        location ~ \.php$ { return 404; }
        location ~ /\.(?!well-known) { deny all; }
    }
}
