server {
    listen 80;
    server_name simasta.bpskotabatu.com;

    # Cloudflare Tunnel terminates HTTPS before reaching this origin.
    location / {
        proxy_pass http://127.0.0.1:5013;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl http2;
    server_name simasta.bpskotabatu.com;
    ssl_certificate /etc/ssl/certs/simasta.crt;
    ssl_certificate_key /etc/ssl/private/simasta.key;

    location / {
        proxy_pass http://127.0.0.1:5013;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
