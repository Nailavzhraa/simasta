[global]
pid = /var/www/simasta.bpskotabatu.com/storage/run/php-fpm.pid
error_log = /var/www/simasta.bpskotabatu.com/storage/logs/php-fpm.log
daemonize = no

[simasta]
user = simasta
group = simasta
listen = /var/www/simasta.bpskotabatu.com/storage/run/php.sock
listen.mode = 0600
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500
clear_env = yes
catch_workers_output = yes
security.limit_extensions = .php
php_admin_value[upload_tmp_dir] = /var/www/simasta.bpskotabatu.com/storage/run/uploads
php_admin_value[session.save_path] = /var/www/simasta.bpskotabatu.com/storage/framework/sessions
